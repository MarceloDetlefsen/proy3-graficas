[package]
name = "proy3-graficas"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = "line-tables-only"

[dependencies]
raylib = { version = "6.0.0", features = ["SUPPORT_IMAGE_GENERATION"] }
noise = "0.9"
